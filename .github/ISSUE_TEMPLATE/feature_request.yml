name: Feature request
description: Propose a user-valued feature
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Who has the problem, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide Given/When/Then scenarios and edge cases.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and dependencies
